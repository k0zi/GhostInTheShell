# nfpm configuration for the .deb and .rpm packages. Driven by build-packages.sh, which sets the
# GITS_* environment variables, stages the build in artifacts/stage/ and runs nfpm from the repository root.
# nfpm expands ${VAR} in scalar fields (version, prerelease) but NOT in contents src paths.
name: ghostintheshell
arch: amd64
platform: linux
version: ${GITS_VERSION}
prerelease: ${GITS_PRERELEASE}
release: 1
section: devel
priority: optional
maintainer: David Kozma <k0zi@outlook.com>
vendor: David Kozma
homepage: https://github.com/k0zi/GhostInTheShell
license: MIT
description: |-
  Desktop manager for sandboxed Linux machines with coding agents
  Creates, starts, stops, deletes and opens terminals into isolated Linux sandboxes
  (Ubuntu, Fedora or Manjaro) running as rootless Podman containers, with coding
  agents and development environments preinstalled.

contents:
  # type: tree keeps the directory structure (a trailing-slash glob flattens subfolders and collides).
  - src: artifacts/stage/app
    dst: /usr/lib/ghostintheshell
    type: tree
  - src: /usr/lib/ghostintheshell/GhostInTheShell
    dst: /usr/bin/ghostintheshell
    type: symlink
  # Menu entry + icon.
  - src: artifacts/stage/ghostintheshell.desktop
    dst: /usr/share/applications/ghostintheshell.desktop
  - src: artifacts/stage/ghostintheshell.png
    dst: /usr/share/icons/hicolor/512x512/apps/ghostintheshell.png
  # ── licence: Debian policy location vs. RPM %license ──
  - src: artifacts/stage/LICENSE
    dst: /usr/share/doc/ghostintheshell/copyright
    packager: deb
  - src: artifacts/stage/LICENSE
    dst: /usr/share/licenses/ghostintheshell/LICENSE
    packager: rpm
    type: license
  # Third-party notices and license texts for the redistributed components (see THIRD_PARTY_NOTICES.md).
  - src: artifacts/stage/THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/ghostintheshell/THIRD_PARTY_NOTICES.md
    packager: deb
  - src: artifacts/stage/licenses
    dst: /usr/share/doc/ghostintheshell/licenses
    type: tree
    packager: deb
  - src: artifacts/stage/THIRD_PARTY_NOTICES.md
    dst: /usr/share/licenses/ghostintheshell/THIRD_PARTY_NOTICES.md
    packager: rpm
    type: license
  - src: artifacts/stage/licenses
    dst: /usr/share/licenses/ghostintheshell/licenses
    type: tree
    packager: rpm

# Self-contained .NET build: only native libraries of the base system are needed.
# Hard: .NET runtime (C++ runtime, zlib, ICU), OpenSSL (loaded by .NET for SHA-256, used to tag the machine
# images) and Avalonia's X11 backend + Skia (fontconfig).
# Recommended: GPU rendering, GTK (native file dialogs) and Podman, which runs the machines; it is only
# a recommendation so a Podman from another source still works (apt, dnf and zypper install it by default).
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libicu80 | libicu79 | libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70 | libicu67
      - libssl3t64 | libssl3 | libssl1.1
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
      - libfontconfig1
    recommends:
      - podman
      - libgl1
      - libegl1
      - libvulkan1
      - libgtk-3-0t64 | libgtk-3-0
  rpm:
    # Shared-library capabilities have the same names on Fedora/RHEL and openSUSE, unlike the package names.
    depends:
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - (libicuuc.so.80()(64bit) or libicuuc.so.79()(64bit) or libicuuc.so.78()(64bit) or libicuuc.so.77()(64bit) or libicuuc.so.76()(64bit) or libicuuc.so.75()(64bit) or libicuuc.so.74()(64bit) or libicuuc.so.73()(64bit) or libicuuc.so.72()(64bit) or libicuuc.so.71()(64bit) or libicuuc.so.70()(64bit) or libicuuc.so.69()(64bit) or libicuuc.so.67()(64bit) or libicuuc.so.65()(64bit))
      - (libssl.so.3()(64bit) or libssl.so.1.1()(64bit))
      - libX11.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libfontconfig.so.1()(64bit)
    recommends:
      - podman
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libvulkan.so.1()(64bit)
      - libgtk-3.so.0()(64bit)
